<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contato | Vitor Angotti Américo da Silva</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Cabeçalho com menu (igual em todas as páginas) -->
<header>
  <div class="nav">
    <a class="logo" href="sobre.html">Vitor<span>.</span>Angotti</a>
    <nav id="menu" aria-label="Menu principal">
      <ul>
        <li><a href="sobre.html">Sobre mim</a></li>
        <li><a href="formacao.html">Formação</a></li>
        <li><a href="portfolio.html">Portfólio</a></li>
        <li><a href="contato.html" class="ativo">Contato</a></li>
      </ul>
    </nav>
    <div class="acoes">
      <button class="btn-icone" id="temaBtn" aria-label="Alternar tema claro/escuro">☀</button>
      <button class="btn-icone" id="menuBtn" aria-label="Abrir menu">☰</button>
    </div>
  </div>
</header>

<main>
  <!-- Conteúdo principal: Contato -->
  <section id="contato">
    <h2>Contato</h2>
    <div class="contato-grid">
      <!-- Formulário (validação feita em js/script.js) -->
      <form id="formContato" class="card" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" autocomplete="name">
          <span class="erro" id="erro-nome"></span>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email">
          <span class="erro" id="erro-email"></span>
        </div>
        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" rows="5"></textarea>
          <span class="erro" id="erro-mensagem"></span>
        </div>
        <button type="submit" class="btn-link">Enviar mensagem</button>
      </form>

      <!-- Contato direto -->
      <aside class="card">
        <h3>Redes</h3>
        <p>Prefere falar direto comigo? Me encontre no LinkedIn.</p>
        <p class="mais"><a class="btn-link" href="https://www.linkedin.com/in/vitor-angotti-128b8516a/" target="_blank" rel="noopener">LinkedIn ↗</a></p>
      </aside>
    </div>

    <!-- Caixa de confirmação (aparece após o envio simulado) -->
    <div class="modal" id="modal" hidden>
      <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
        <h3 id="modalTitulo">Mensagem enviada com sucesso!</h3>
        <p>Obrigado pelo contato.</p>
        <button type="button" class="btn-link" id="modalFechar">Fechar</button>
      </div>
    </div>
  </section>
</main>

<footer>© 2026 Vitor Angotti Américo da Silva</footer>

<script src="js/script.js"></script>
</body>
</html>
